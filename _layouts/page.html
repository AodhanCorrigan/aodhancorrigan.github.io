---
layout: default
---
<article class="article">
  <a class="back-link" href="{{ '/' | relative_url }}">← Home</a>
  <header class="article-heading"><p class="eyebrow">{{ page.eyebrow | escape }}</p><h1>{{ page.title | escape }}</h1></header>
  {% if page.pdf and page.pdf != '' %}<p><a class="text-link" href="{{ page.pdf | relative_url }}">Download CV (PDF) ↗</a></p>{% endif %}
  <div class="prose">{{ content }}</div>
</article>
