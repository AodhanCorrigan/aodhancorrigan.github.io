<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.summary | default: site.description | escape }}">
  {% if page.example %}<meta name="robots" content="noindex">{% endif %}
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header wrap">
    <a class="wordmark" href="{{ '/' | relative_url }}">Aodhan Corrigan<span class="mark" aria-hidden="true">.</span></a>
    <nav aria-label="Main navigation">
      <a href="{{ '/research/' | relative_url }}" {% if page.url contains '/research/' %}aria-current="page"{% endif %}>Research</a>
      <a href="{{ '/stories/' | relative_url }}" {% if page.url contains '/stories/' %}aria-current="page"{% endif %}>Photography &amp; stories</a>
      <a href="{{ '/hobbies/' | relative_url }}" {% if page.url contains '/hobbies/' %}aria-current="page"{% endif %}>Hobbies</a>
      <a href="{{ '/cv/' | relative_url }}" {% if page.url contains '/cv/' %}aria-current="page"{% endif %}>CV</a>
    </nav>
  </header>
  <main id="main" class="wrap">{{ content }}</main>
  <footer class="site-footer wrap"><span>© {{ site.time | date: '%Y' }} Aodhan Corrigan</span><a href="{{ '/' | relative_url }}">Home</a></footer>
</body>
</html>
